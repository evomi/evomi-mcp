[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evomi-mcp"
version = "1.3.0"
description = "MCP server for the Evomi proxy and web scraping APIs"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Evomi", email = "support@evomi.com" }
]
keywords = [
    "mcp",
    "evomi",
    "proxy",
    "web scraping",
    "scraper",
    "ai",
    "claude",
    "model context protocol",
]
# SPDX expression plus the file itself (PEP 639), so both reach the wheel's
# METADATA and the PyPI project page.
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # server.py registers its handlers against both the mcp 1.x decorator API
    # and the mcp 2.x `on_*` constructor kwargs, so both majors resolve to a
    # working install.
    #
    # Three things in the SDK set the floor at mcp 1.8.0:
    #   mcp 1.2.0  `Server(version=...)`, so the server reports its own version.
    #   mcp 1.7.0  `mcp.types.ToolAnnotations`; below it annotations.py cannot
    #              import.
    #   mcp 1.8.0  stdio_server exits at EOF on stdin. Below it the process
    #              outlives the client that started it.
    #
    # The ceiling excludes an mcp 3.0 that does not exist yet. Each major has
    # changed the handler API, so the range widens once CI has run against the
    # new one.
    "mcp>=1.8.0,<3",
    # Validates tool arguments against their inputSchema. It arrives
    # transitively via mcp on both majors, but server.py imports it directly:
    # mcp 2.x performs no argument validation of its own.
    "jsonschema>=4.20.0",
    "httpx>=0.27.0,<1",
    "pydantic>=2.0.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://evomi.com"
Documentation = "https://docs.evomi.com"
Repository = "https://github.com/evomi/evomi-mcp"

[project.scripts]
evomi-mcp = "evomi_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evomi_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"